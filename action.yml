name: mcp-server-doctor
description: Diagnose MCP client configs and stdio startup handshakes, with optional SARIF upload.

branding:
  icon: activity
  color: blue

inputs:
  path:
    description: Config file or directory to scan.
    required: false
    default: .
  command:
    description: mcp-server-doctor command to run, usually check or doctor.
    required: false
    default: check
  python-version:
    description: Python version used to run mcp-server-doctor.
    required: false
    default: "3.12"
  warnings-as-errors:
    description: Return a failing exit code for warning findings.
    required: false
    default: "false"
  sarif-file:
    description: Path where the SARIF report will be written.
    required: false
    default: mcp-server-doctor.sarif
  upload-results:
    description: Upload the SARIF report to GitHub code scanning.
    required: false
    default: "false"
  fail-on-findings:
    description: Fail the workflow when mcp-server-doctor returns a non-zero exit code.
    required: false
    default: "true"
  extra-args:
    description: Additional arguments passed to mcp-server-doctor.
    required: false
    default: ""

outputs:
  sarif-file:
    description: SARIF report path.
    value: ${{ steps.run.outputs.sarif-file }}
  exit-code:
    description: mcp-server-doctor exit code.
    value: ${{ steps.run.outputs.exit-code }}

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install mcp-server-doctor
      shell: bash
      run: python -m pip install "$GITHUB_ACTION_PATH"

    - name: Run mcp-server-doctor
      id: run
      shell: bash
      run: |
        set +e
        args=()
        if [[ "${{ inputs.warnings-as-errors }}" == "true" ]]; then
          args+=("--warnings-as-errors")
        fi
        mcp-server-doctor "${{ inputs.command }}" "${{ inputs.path }}" --format sarif --output "${{ inputs.sarif-file }}" "${args[@]}" ${{ inputs.extra-args }}
        exit_code=$?
        echo "exit-code=${exit_code}" >> "$GITHUB_OUTPUT"
        echo "sarif-file=${{ inputs.sarif-file }}" >> "$GITHUB_OUTPUT"
        mcp-server-doctor "${{ inputs.command }}" "${{ inputs.path }}" "${args[@]}" ${{ inputs.extra-args }} || true
        exit 0

    - name: Upload SARIF
      if: ${{ inputs.upload-results == 'true' }}
      uses: github/codeql-action/upload-sarif@v4
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: mcp-server-doctor

    - name: Fail on findings
      if: ${{ inputs.fail-on-findings == 'true' && steps.run.outputs.exit-code != '0' }}
      shell: bash
      run: exit "${{ steps.run.outputs.exit-code }}"
